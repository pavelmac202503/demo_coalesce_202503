name: DS_CUSTOMER
operation:
  config:
    postSQL: |-
      MERGE INTO SANDBOX_DWH.DATASTORE.DS_CUSTOMER tar
      USING
      (select ds.c_custkey
      FROM   SANDBOX_DWH.DATASTORE.DS_CUSTOMER DS
             LEFT OUTER JOIN SANDBOX_DWH.STG_DATASTORE.STG_DS_CUSTOMER STG
                ON (ds.c_custkey = stg.c_custkey)
      WHERE  1=1
      and DS.dss_deleted_flag = 'N'
      AND    stg.c_custkey IS NULL) upd
         ON (tar.c_custkey = upd.c_custkey)
      WHEN MATCHED
      THEN
      UPDATE
      SET   dss_deleted_flag = 'Y';
    preSQL: ""
    testsEnabled: true
  database: ""
  deployEnabled: true
