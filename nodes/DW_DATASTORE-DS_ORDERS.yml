name: DS_ORDERS
operation:
  config:
    postSQL: |-
      MERGE INTO SANDBOX_DWH.DATASTORE.DS_ORDERS tar
      USING
      (select ds.o_orderkey
      FROM   SANDBOX_DWH.DATASTORE.DS_ORDERS DS
             LEFT OUTER JOIN SANDBOX_DWH.STG_DATASTORE.STG_DS_ORDERS STG
                ON (ds.o_orderkey = stg.o_orderkey)
      WHERE  1=1
      and DS.dss_deleted_flag = 'N'
      AND    stg.o_orderkey IS NULL) upd
         ON (tar.o_orderkey = upd.o_orderkey)
      WHEN MATCHED
      THEN
      UPDATE
      SET   dss_deleted_flag = 'Y';
    preSQL: ""
    testsEnabled: true
  database: ""
  deployEnabled: true
  description: Orders data as defined by TPC-H
